<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>분수 에이스</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081a20;color:#fff;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}main{position:relative;width:min(100vw,66.666dvh,540px);aspect-ratio:2/3;overflow:hidden;background:#174b46;box-shadow:0 0 60px #0009}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:start;padding:10px;pointer-events:none}.status,button{background:#09232eeb;color:white;border:1px solid #99d7cd80;border-radius:10px;padding:9px 12px}.status{font-size:clamp(11px,2.8vw,15px);line-height:1.45}button{font:inherit;cursor:pointer;pointer-events:auto;min-height:42px}button:focus-visible{outline:3px solid #ffdb72}button:hover{background:#20515b}.hud button{font-weight:bold}.panel{position:absolute;inset:0;background:#02141bc7;display:grid;place-items:center;padding:12px}.panel[hidden],button[hidden]{display:none}.box{width:min(100%,386px);max-height:100%;overflow:auto;background:#102f37;border:1px solid #71aaa4;border-radius:18px;padding:clamp(12px,4vw,23px);text-align:center;box-shadow:0 12px 38px #0008}h1,h2,p{margin:0 0 12px}h1{font-size:clamp(24px,7vw,38px)}h2{font-size:clamp(16px,4.4vw,24px)}.choices{display:grid;gap:7px}.small{font-size:.82em;color:#c6e3df}.options{display:flex;gap:7px;justify-content:center}.options button{flex:1}.parts{display:flex;margin:12px auto;max-width:280px;border:2px solid #d3fff4;border-radius:5px;overflow:hidden}.parts span{height:36px;flex:1;background:#f0faf4;border-right:1px solid #153d41}.parts span:last-child{border:0}.parts .mark{background:repeating-linear-gradient(135deg,#ffcd56 0 5px,#a45b00 5px 7px)}.fraction{display:inline-grid;vertical-align:middle;line-height:1.17;text-align:center;min-width:18px}.fraction b:first-child{border-bottom:1px solid currentColor}.hint{color:#ffe38d}
.choices [data-ship]{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}.ship-preview{width:54px;height:47px;flex:none}.player-health{display:block;width:100%;height:9px;margin-top:5px;appearance:none;border:0;border-radius:5px;overflow:hidden;background:#244249;color:#56eeb3}.player-health::-webkit-progress-bar{background:#244249}.player-health::-webkit-progress-value{background:#56eeb3}.player-health::-moz-progress-bar{background:#56eeb3}.player-health.low::-webkit-progress-value{background:#ff926b}.player-health.low::-moz-progress-bar{background:#ff926b}
.comparison{display:inline-block;font-size:1.35em;margin-top:12px}.whole-parts .parts{margin:5px auto}.whole-parts .parts span{height:13px}#cinematic{position:absolute;inset:0;background:#051326}#cinematic video{width:100%;height:100%;display:block;object-fit:contain}.panel:has(.start-screen),.panel:has(.skip-video){background:none;padding:0;pointer-events:none}.panel:has(.start-screen) .box,.panel:has(.skip-video) .box{width:100%;height:100%;max-height:none;padding:0;overflow:hidden;border:0;border-radius:0;background:none}.start-screen{width:100%;height:100%;border:0;padding:0;border-radius:0;display:block}.start-screen img{width:100%;height:100%;display:block;object-fit:cover}.skip-video{position:absolute;right:12px;top:12px;background:#09232eed}
</style></head><body><main aria-label="분수 에이스"><canvas width="480" height="720" aria-label="전투 화면"></canvas><div class="hud"><div class="status" id="status">1 정글 상공</div><button id="pause" aria-label="일시정지" hidden>Ⅱ</button></div><div id="cinematic" hidden></div><div class="panel" id="panel"><div class="box" id="box"></div></div></main><script src="stages.js"></script><script src="game.js"></script></body></html>
